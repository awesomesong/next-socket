name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (next-server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint
